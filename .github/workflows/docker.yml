name: docker

# fork: images only on published releases (no :main image per push); the
# push-only steps below are left in place to keep upstream merges small
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # supersede stale main builds, but never cancel a release image mid-push
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # for vite extracting git tag/hash
      - name: Normalize repository name
        run: echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY }}
          tags: |
            # on release: semver tags, e.g. v1.2.3 -> 1.2.3 (plus latest via the
            # action's default flavor on non-prerelease tags)
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            # on push to main: tag with main
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Set up toolchains
        if: github.event_name == 'push'
        uses: ./.github/actions/setup-toolchains
        with:
          setup-node: "true"
      - name: Build binaries from source
        if: github.event_name == 'push'
        run: |
          mkdir -p ./build
          rm -f ./build/refusion-linux-amd64 ./build/refusion-linux-arm64
          ./scripts.sh build-frontend
          ./scripts.sh build-backend linux amd64 ./build/refusion-linux-amd64
          ./scripts.sh build-backend linux arm64 ./build/refusion-linux-arm64
      - name: Download binaries from release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./build
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "refusion-linux-amd64" \
            --pattern "refusion-linux-arm64" \
            --pattern "checksums.txt" \
            --dir ./build
          cd ./build
          grep -E ' \./refusion-linux-(amd64|arm64)$' checksums.txt | sha256sum --strict -c -
          test "$(grep -cE ' \./refusion-linux-(amd64|arm64)$' checksums.txt)" -eq 2
      - name: Verify prepared binaries
        run: |
          test -f ./build/refusion-linux-amd64
          test -f ./build/refusion-linux-arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
